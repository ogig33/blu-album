<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player access test</title>
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --mut: #6e6e73; --line: #d2d2d7; --ok: #1a7f37; --err: #c62828; --acc: #0a66c2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f5f5f7; --mut: #a1a1a6; --line: #3a3a3c; --ok: #4ac26b; --err: #ff6b6b; --acc: #6cb4ff; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--mut); margin: 0 0 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input { flex: 1 1 200px; padding: 8px 10px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  button { padding: 8px 14px; font: inherit; border: 0; border-radius: 8px; background: var(--acc); color: #fff; cursor: pointer; }
  a { color: var(--acc); }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; color: var(--mut); font-size: 13px; }
  td.r { white-space: nowrap; font-weight: 600; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  code, pre { font: 13px/1.4 ui-monospace, Menlo, monospace; }
  pre { white-space: pre-wrap; word-break: break-all; margin: 0; color: var(--mut); }
  img { height: 48px; vertical-align: middle; }
</style>
</head>
<body>
<main>
  <h1>Player access test</h1>
  <p>Can this page, as it is loaded, reach a BluOS player in the home network? Read-only requests (<code>/SyncStatus</code> and a player icon). Nothing leaves the home network; the address stays in this browser.</p>
  <div class="row">
    <input id="ip" placeholder="IP address of the player, e.g. 192.168.1.100" autocomplete="off" spellcheck="false">
    <button id="run">Run tests</button>
  </div>
  <p id="cert"></p>
  <table>
    <thead><tr><th>Test</th><th>Result</th><th>Details</th></tr></thead>
    <tbody id="out"></tbody>
  </table>
  <pre id="env"></pre>
</main>
<script>
const $ = (s) => document.querySelector(s);
try { $("#ip").value = localStorage.getItem("playerAccessTestIp") || ""; } catch (e) {}
$("#env").textContent = ["origin: " + location.origin, "secure context: " + window.isSecureContext, "user agent: " + navigator.userAgent].join("\n");

const tests = (ip) => [
  ["HTTP 11000, fetch", "http://" + ip + ":11000/SyncStatus", {}],
  ["HTTP 11000, fetch with targetAddressSpace local (Chrome)", "http://" + ip + ":11000/SyncStatus", { targetAddressSpace: "local" }],
  ["HTTPS 11005, fetch", "https://" + ip + ":11005/SyncStatus", {}],
  ["HTTPS 11005, player icon as blob", "https://" + ip + ":11005/SyncStatus", {}, true],
];

async function one([name, url, extra, icon]) {
  const t0 = performance.now();
  try {
    const r = await fetch(url, { headers: { "Accept-Language": "en" }, cache: "no-store", ...extra });
    const text = await r.text();
    const ms = Math.round(performance.now() - t0);
    const root = (text.match(/<SyncStatus\b[^>]*>/) || [""])[0];
    const name1 = (root.match(/\sname="([^"]*)"/) || [])[1] || "";
    if (!icon) return { ok: r.ok && !!root, info: "HTTP " + r.status + ", " + ms + " ms" + (name1 ? ", player \"" + name1 + "\"" : ", no SyncStatus") };
    const path = (root.match(/\sicon="([^"]*)"/) || [])[1];
    if (!path) return { ok: false, info: "no icon in SyncStatus" };
    const ir = await fetch(url.replace(/\/SyncStatus$/, path), { cache: "no-store" });
    const blob = await ir.blob();
    return { ok: ir.ok, info: "HTTP " + ir.status + ", " + blob.type + ", " + blob.size + " bytes", img: URL.createObjectURL(blob) };
  } catch (e) {
    return { ok: false, info: (e && e.name ? e.name + ": " : "") + (e && e.message ? e.message : String(e)) + " (" + Math.round(performance.now() - t0) + " ms; details in the browser console)" };
  }
}

$("#run").addEventListener("click", async () => {
  const ip = $("#ip").value.trim();
  if (!/^[\w.:-]+$/.test(ip)) { $("#ip").focus(); return; }
  try { localStorage.setItem("playerAccessTestIp", ip); } catch (e) {}
  const certUrl = "https://" + ip + ":11005/SyncStatus";
  $("#cert").innerHTML = "";
  const a = document.createElement("a"); a.href = certUrl; a.target = "_blank"; a.rel = "noopener"; a.textContent = certUrl;
  $("#cert").append("HTTPS tests fail until the browser accepts the player's self-signed certificate: open ", a, ", accept the warning, then run the tests again.");
  const out = $("#out"); out.innerHTML = "";
  for (const t of tests(ip)) {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td></td><td class='r'>…</td><td></td>";
    tr.cells[0].textContent = t[0];
    out.append(tr);
    const r = await one(t);
    tr.cells[1].textContent = r.ok ? "OK" : "failed";
    tr.cells[1].className = "r " + (r.ok ? "ok" : "err");
    tr.cells[2].textContent = r.info;
    if (r.img) { const im = new Image(); im.src = r.img; im.alt = ""; tr.cells[2].append(" ", im); }
  }
});
</script>
</body>
</html>
