# UI tests of BluAlbum (tests/ui) on macOS, Windows and Linux in every supported browser,
# each at three window sizes, all tests (--all); screenshots of the main views are kept as artifacts.
# The tests run against the mock player with the sanitized fixtures: no player, no network.
name: UI tests

on:
  push:
    branches: [main]
    paths: [blualbum.html, "tests/ui/**", .github/workflows/ui-tests.yml]
  pull_request:
    paths: [blualbum.html, "tests/ui/**", .github/workflows/ui-tests.yml]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Mondays: catches new browser versions without a code change

permissions:
  contents: read

jobs:
  ui:
    name: ${{ matrix.target.os }} / ${{ matrix.target.browser }} / ${{ matrix.viewport }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          # Safari: Playwright's WebKit build, only on macOS (closest to the real Safari)
          - { os: macos-latest, browser: safari, install: webkit }
          - { os: macos-latest, browser: chrome }
          - { os: windows-latest, browser: edge }
          - { os: windows-latest, browser: chrome }
          - { os: windows-latest, browser: firefox, install: firefox }
          - { os: ubuntu-latest, browser: chrome }
          - { os: ubuntu-latest, browser: firefox, install: firefox }
        # Window size and device pixel ratio: small laptop, Retina laptop, desktop monitor
        viewport: [1280x800, 1440x900@2, 1920x1080]
    defaults:
      run:
        working-directory: tests/ui
    env:
      UI_SLOW: "2" # runners are slower than a desktop machine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - run: npm ci
      # Chrome and Edge are preinstalled on the runners (the real, current apps);
      # WebKit and Firefox come from Playwright.
      - if: matrix.target.install
        run: npx playwright install --with-deps ${{ matrix.target.install }}
      - run: node run.js --all --browser ${{ matrix.target.browser }} --viewport ${{ matrix.viewport }} --shots
      # Screenshots of the main views (views/) and of failed tests, for a visual check
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.target.os }}-${{ matrix.target.browser }}-${{ matrix.viewport }}
          path: tests/ui/test-results/
          if-no-files-found: ignore
          retention-days: 14
